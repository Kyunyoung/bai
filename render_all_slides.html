<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>PDF.js Auto Renderer</title>
  <script src="pdf.min.js"></script>
</head>
<body style="font-family:sans-serif; padding:30px; background:#f4f6f9; text-align:center;">
  <h1 style="color:#1e3a8a;">🚀 PDF.js 59개 슬라이드 원본 이미지 자동 렌더링</h1>
  <p style="color:#475569; margin-top:8px;">최신 PDF 교재의 59개 전체 슬라이드를 고해상도(1920px) 이미지로 자동 추출하여 포털에 동기화합니다.</p>
  
  <button id="startBtn" onclick="startRendering()" style="margin:20px; padding:14px 28px; font-size:1.1rem; font-weight:bold; background:#2563eb; color:white; border:none; border-radius:8px; cursor:pointer;">
    🚀 슬라이드 렌더링 시작하기 (자동 실행 중)
  </button>

  <div id="status" style="font-size:1.3rem; font-weight:bold; color:#2563eb; margin:15px 0;">작업 준비 중...</div>
  <div id="log" style="font-family:monospace; text-align:left; background:#ffffff; padding:15px; border:1px solid #cbd5e1; border-radius:8px; max-height:400px; overflow-y:auto; margin:0 auto; max-width:800px;"></div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

    function log(msg) {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML += msg + '<br>';
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    let isRunning = false;
    async function startRendering() {
      if (isRunning) return;
      isRunning = true;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('startBtn').style.opacity = '0.5';

      try {
        document.getElementById('status').textContent = 'PDF 파일 읽는 중...';
        log('PDF 파일 로딩 시작: vibe_coding_55_scenario_offline_install_added.pdf');

        const loadingTask = pdfjsLib.getDocument('vibe_coding_55_scenario_offline_install_added.pdf');
        const pdf = await loadingTask.promise;
        const totalPages = pdf.numPages;
        log(`PDF 총 페이지 수: ${totalPages} 장`);

        for (let num = 1; num <= totalPages; num++) {
          document.getElementById('status').textContent = `슬라이드 ${num} / ${totalPages} 렌더링 및 저장 중...`;
          const page = await pdf.getPage(num);
          
          const unscaledViewport = page.getViewport({ scale: 1.0 });
          const targetWidth = 1920;
          const scale = targetWidth / unscaledViewport.width;
          const viewport = page.getViewport({ scale: scale });

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.width = viewport.width;
          canvas.height = viewport.height;

          const renderContext = {
            canvasContext: context,
            viewport: viewport
          };

          await page.render(renderContext).promise;

          const dataUrl = canvas.toDataURL('image/jpeg', 0.92);

          log(`슬라이드 ${num} / ${totalPages} 업로드 중 (${Math.round(dataUrl.length / 1024)} KB)...`);
          await fetch(`http://127.0.0.1:8888/upload?num=${num}`, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: dataUrl
          });

          log(`✅ 슬라이드 ${num} / ${totalPages} 저장 성공!`);
        }

        document.getElementById('status').textContent = '🎉 전체 59개 슬라이드 PDF 원본 이미지 렌더링 완수!';
        log('모든 작업이 완벽하게 끝났습니다. 포털 페이지(index.html)에서 확인하세요.');
      } catch (err) {
        document.getElementById('status').textContent = '❌ 오류 발생: ' + err.message;
        log('오류 상세: ' + err.stack);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(startRendering, 500);
    });
  </script>
</body>
</html>
