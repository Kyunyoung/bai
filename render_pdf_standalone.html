<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>PDF Direct Renderer</title>
  <script src="pdf.min.js"></script>
</head>
<body style="font-family:sans-serif; padding:30px; background:#f4f6f9; text-align:center;">
  <h1 style="color:#1e3a8a;">🚀 PDF 원본 슬라이드 59장 렌더링 진행 중...</h1>
  <button onclick="startRendering()" style="padding:10px 20px; font-size:1.1rem; margin:15px; background:#2563eb; color:white; border:none; border-radius:6px; cursor:pointer;">
    🚀 렌더링 수동 시작
  </button>
  <div id="status" style="font-size:1.3rem; font-weight:bold; color:#2563eb; margin:15px 0;">PDF 데이터 준비 중...</div>
  <div id="log" style="font-family:monospace; text-align:left; background:#ffffff; padding:15px; border:1px solid #cbd5e1; border-radius:8px; max-height:400px; overflow-y:auto; margin:0 auto; max-width:800px;"></div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

    function log(msg) {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML += msg + '<br>';
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    let isRunning = false;
    async function startRendering() {
      if (isRunning) return;
      isRunning = true;

      try {
        log('PDF 렌더링 시작...');
        const response = await fetch('vibe_coding_55_scenario_offline_install_added.pdf');
        const arrayBuffer = await response.arrayBuffer();

        log('PDF.js 로딩 및 문서 파싱 중...');
        const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
        const pdf = await loadingTask.promise;
        const totalPages = pdf.numPages;
        log(`PDF 총 페이지 수: ${totalPages} 장`);

        for (let num = 1; num <= totalPages; num++) {
          document.getElementById('status').textContent = `PDF 슬라이드 ${num} / ${totalPages} 렌더링 및 저장 중...`;
          const page = await pdf.getPage(num);
          
          const unscaledViewport = page.getViewport({ scale: 1.0 });
          const targetWidth = 1920;
          const scale = targetWidth / unscaledViewport.width;
          const viewport = page.getViewport({ scale: scale });

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.width = viewport.width;
          canvas.height = viewport.height;

          await page.render({ canvasContext: context, viewport: viewport }).promise;

          const dataUrl = canvas.toDataURL('image/jpeg', 0.92);

          log(`PDF 슬라이드 ${num} / ${totalPages} 업로드 (${Math.round(dataUrl.length / 1024)} KB)...`);
          await fetch(`http://127.0.0.1:9999/upload?num=${num}`, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: dataUrl
          });

          log(`✅ PDF 슬라이드 ${num} / ${totalPages} 저장 완수!`);
        }

        document.getElementById('status').textContent = '🎉 전체 59개 PDF 슬라이드 원본 이미지 렌더링 완수!';
        log('모든 슬라이드가 저장되었습니다.');
      } catch (err) {
        document.getElementById('status').textContent = '❌ 오류 발생: ' + err.message;
        log('오류 상세: ' + err.stack);
      }
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      setTimeout(startRendering, 200);
    } else {
      document.addEventListener('DOMContentLoaded', startRendering);
    }
  </script>
</body>
</html>
