<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브코딩 사내 교육 포털 | PPT 59개 슬라이드 교재</title>
  <meta name="description" content="바이브코딩 사내 교육 포털 - 250개 경찰서 엑셀 취합 및 표도우미 실습 59개 슬라이드 교육 교재 전용 슬라이드 뷰어">
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- Main Site Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="#" class="brand-logo" title="바이브코딩 교육 포털 메인">
        <div class="logo-icon">🚀</div>
        <div>
          <span>VIBE CODING</span>
          <span class="brand-badge">PDF 원본 뷰어</span>
        </div>
      </a>

      <!-- Header Actions -->
      <div class="header-actions">
        <!-- Dark / Light Theme Toggle -->
        <button id="themeToggleBtn" class="theme-toggle-btn" title="다크/라이트 모드 전환" aria-label="테마 전환">
          <span id="themeIcon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Portal Container -->
  <div class="app-container" style="max-width: 1040px; padding: 24px 16px;">

    <!-- Top Compact Header & Progress Status -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px; flex-wrap:wrap; gap:12px;">
      <div>
        <h1 style="font-size: 1.5rem; font-weight: 800; color:var(--text-main); margin-bottom:4px;">
          📊 업무 자동화를 위한 바이브 코딩 (PDF 59개 슬라이드 원본)
        </h1>
        <p style="font-size: 0.875rem; color:var(--text-muted);">
          vibe_coding_55_scenario_offline_install_added.pdf 원본 슬라이드 59장을 정독하세요.
        </p>
      </div>

      <div style="display:flex; align-items:center; gap:12px; background:var(--bg-card); padding:8px 16px; border-radius:var(--radius-md); border:1px solid var(--border-color);">
        <span style="font-size:0.85rem; font-weight:700; color:var(--primary-600);">학습 진도율</span>
        <span style="font-size:1.2rem; font-weight:800; color:var(--primary-600);" id="statOverallProgress">0%</span>
        <span style="font-size:0.8rem; color:var(--text-muted);" id="statSlideCountDisplay">(0 / 59)</span>
      </div>
    </div>

    <!-- Part Category Tabs -->
    <div class="category-tabs" id="partTabs" style="margin-bottom: 16px;">
      <button class="tab-btn active" data-part="all">
        <span>📚 전체 슬라이드 (59)</span>
      </button>
      <button class="tab-btn" data-part="PART 01">
        <span>PART 01. 도입부</span>
      </button>
      <button class="tab-btn" data-part="PART 02">
        <span>PART 02. 세팅</span>
      </button>
      <button class="tab-btn" data-part="PART 03">
        <span>PART 03. 엑셀취합</span>
      </button>
      <button class="tab-btn" data-part="PART 04">
        <span>PART 04. 표도우미</span>
      </button>
    </div>

    <!-- MAIN SINGLE THEATER SLIDE VIEWER CANVAS -->
    <main id="mainViewerStage" style="width:100%;">
      <!-- Injected by script.js -->
    </main>

  </div>

  <script src="script.js?v=8"></script>
</body>
</html>
